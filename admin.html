<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - Game Realms</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="brand-logo">G</div><h1>Panel Admin</h1></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="reports">Laporan</button>
    <button class="tab-btn" data-tab="users">Kelola User</button>
    <button class="tab-btn" data-tab="banner">Banner</button>
    <button class="tab-btn" data-tab="livechat">Live Chat</button>
  </div>

  <div id="panelReports"><div class="empty-state">Memuat...</div></div>
  <div id="panelUsers" style="display:none;">
    <div class="field"><input type="text" id="searchUser" placeholder="Cari username..." /></div>
    <div id="userList"><div class="empty-state">Memuat...</div></div>
  </div>
  <div id="panelBanner" style="display:none;">
    <div class="card">
      <h2 class="section-title">Banner beranda (PNG/JPG)</h2>
      <img id="bannerPreview" src="" style="display:none;width:100%;border-radius:12px;margin-bottom:12px;object-fit:cover;max-height:160px;" />
      <div class="field"><input type="file" id="bannerFile" accept="image/*" /></div>
      <h2 class="section-title" style="margin-top:16px;">Pengumuman</h2>
      <div class="field"><textarea id="announceText" rows="3" placeholder="Tulis pengumuman yang tampil di halaman Jelajah..."></textarea></div>
      <button class="btn btn-primary" id="btnSimpanBanner">Simpan</button>
    </div>
  </div>
  <div id="panelLivechat" style="display:none;">
    <div id="threadList"><div class="empty-state">Memuat...</div></div>
  </div>
</div>

<div class="modal-overlay" id="modalChatAdmin" style="display:none;">
  <div class="modal-sheet">
    <h3 id="chatAdminTitle">Chat</h3>
    <div class="chat-box" id="chatAdminBox" style="max-height:340px;"></div>
    <div class="chat-input-row">
      <input type="text" id="chatAdminInput" placeholder="Balas sebagai admin..." />
      <button class="btn btn-primary btn-sm" id="chatAdminSend">Kirim</button>
    </div>
    <button class="btn btn-outline btn-sm" id="chatAdminClose" style="margin-top:10px;">Tutup</button>
  </div>
</div>

<script type="module">
  import { auth, db, requireLogin } from "./assets/js/firebase-config.js";
  import { enablePageTransitions, applyTheme, renderBgVideo, escapeHtml, timeAgo, showToast, compressImage, isVvipActive } from "./assets/js/common.js";
  import {
    doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, orderBy, onSnapshot, getDocs, arrayUnion, arrayRemove, Timestamp
  } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  applyTheme();
  enablePageTransitions();
  renderBgVideo();

  let me = null;
  let allUsers = [];

  requireLogin(async (user) => {
    me = user;
    const snap = await getDoc(doc(db,"users",user.uid));
    if (!snap.exists() || !snap.data().isAdmin){
      document.body.innerHTML = "<p style='padding:20px;color:#fff'>Akses ditolak. Halaman ini cuma buat admin.</p>";
      return;
    }
    watchReports();
    watchUsers();
    loadBanner();
    watchThreads();
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panelReports").style.display = btn.dataset.tab==="reports" ? "block":"none";
      document.getElementById("panelUsers").style.display = btn.dataset.tab==="users" ? "block":"none";
      document.getElementById("panelBanner").style.display = btn.dataset.tab==="banner" ? "block":"none";
      document.getElementById("panelLivechat").style.display = btn.dataset.tab==="livechat" ? "block":"none";
    });
  });

  // ===== REPORTS =====
  function watchReports(){
    const q = query(collection(db,"reports"), orderBy("createdAt","desc"));
    onSnapshot(q, (snap) => {
      const el = document.getElementById("panelReports");
      const list = snap.docs.filter(d => !d.data().resolved);
      if (list.length === 0){ el.innerHTML = '<div class="empty-state">Tidak ada laporan baru</div>'; return; }
      el.innerHTML = list.map(d => {
        const r = d.data();
        return `<div class="card">
          <p style="margin:0 0 4px;font-size:13px;"><b>${r.targetType==='lelang'?'Lelang':'Produk'}: ${escapeHtml(r.targetName)}</b></p>
          <p class="muted" style="margin:0 0 8px;font-size:12px;">Alasan: ${escapeHtml(r.reason)} &middot; ${timeAgo(r.createdAt?.toDate?r.createdAt.toDate():new Date())}</p>
          ${r.buktiFoto ? `<img src="${r.buktiFoto}" style="width:100%;border-radius:10px;margin-bottom:10px;max-height:220px;object-fit:cover;" />` : '<p class="muted" style="font-size:11px;">Tidak ada bukti screenshot</p>'}
          <div class="grid-2">
            <button class="btn btn-outline btn-sm" data-resolve="${d.id}">Tandai selesai</button>
            <button class="btn btn-danger btn-sm" data-delete-target="${d.id}" data-target-type="${r.targetType}" data-target-id="${r.targetId}">Hapus konten</button>
          </div>
        </div>`;
      }).join("");

      el.querySelectorAll("[data-resolve]").forEach(btn => btn.addEventListener("click", async () => {
        await updateDoc(doc(db,"reports",btn.dataset.resolve), { resolved:true });
        showToast("Laporan ditandai selesai");
      }));
      el.querySelectorAll("[data-delete-target]").forEach(btn => btn.addEventListener("click", async () => {
        if (!confirm("Hapus konten yang dilaporkan ini?")) return;
        await deleteDoc(doc(db, btn.dataset.targetType, btn.dataset.targetId));
        await updateDoc(doc(db,"reports",btn.dataset.deleteTarget), { resolved:true });
        showToast("Konten dihapus");
      }));
    });
  }

  // ===== USERS =====
  function watchUsers(){
    const q = query(collection(db,"users"), orderBy("createdAt","desc"));
    onSnapshot(q, (snap) => {
      allUsers = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderUsers();
    });
  }
  function renderUsers(){
    const search = document.getElementById("searchUser").value.toLowerCase().trim();
    const list = allUsers.filter(u => !search || (u.username||"").toLowerCase().includes(search));
    const el = document.getElementById("userList");
    if (list.length === 0){ el.innerHTML = '<div class="empty-state">Tidak ada user</div>'; return; }
    el.innerHTML = list.map(u => `
      <div class="card">
        <p style="margin:0 0 4px;font-size:14px;font-weight:600;">${escapeHtml(u.username)} ${u.banned?'<span class="item-badge sold">Banned</span>':''} ${isVvipActive(u)?'<span class="vvip-badge">VVIP</span>':''}</p>
        <p class="muted" style="margin:0 0 4px;font-size:12px;">${escapeHtml(u.email||"-")}</p>
        ${isVvipActive(u) ? `<p class="muted" style="margin:0 0 10px;font-size:11px;">VVIP sampai ${u.vvipUntil.toDate().toLocaleDateString("id-ID")}</p>` : ""}
        <div class="grid-2" style="margin-bottom:8px;">
          <button class="btn btn-sm ${u.banned?'btn-outline':'btn-danger'}" data-ban="${u.id}" data-state="${u.banned?'unban':'ban'}">${u.banned?'Buka Ban':'Ban User'}</button>
          <button class="btn btn-outline btn-sm" data-badge="${u.id}">+ Kasih Badge</button>
        </div>
        <button class="btn btn-sm ${isVvipActive(u)?'btn-outline':'btn-primary'}" data-vvip="${u.id}" data-state="${isVvipActive(u)?'cabut':'kasih'}">${isVvipActive(u)?'Cabut VVIP':'Kasih VVIP'}</button>
      </div>
    `).join("");

    el.querySelectorAll("[data-vvip]").forEach(btn => btn.addEventListener("click", async () => {
      if (btn.dataset.state === "cabut"){
        if (!confirm("Cabut status VVIP user ini?")) return;
        await updateDoc(doc(db,"users",btn.dataset.vvip), { vvip:false });
        showToast("VVIP dicabut");
        return;
      }
      const tanggal = prompt("VVIP berlaku sampai tanggal berapa? (format: YYYY-MM-DD, misal 2026-12-31)");
      if (!tanggal) return;
      const parsed = new Date(tanggal + "T23:59:59");
      if (isNaN(parsed.getTime())) return showToast("Format tanggal gak valid", true);
      await updateDoc(doc(db,"users",btn.dataset.vvip), { vvip:true, vvipUntil: Timestamp.fromDate(parsed) });
      showToast("VVIP diaktifkan sampai " + parsed.toLocaleDateString("id-ID"));
    }));

    el.querySelectorAll("[data-ban]").forEach(btn => btn.addEventListener("click", async () => {
      const ban = btn.dataset.state === "ban";
      await updateDoc(doc(db,"users",btn.dataset.ban), { banned: ban });
      showToast(ban ? "User diban" : "User dibuka banned-nya");
    }));
    el.querySelectorAll("[data-badge]").forEach(btn => btn.addEventListener("click", async () => {
      const badge = prompt('Nama badge (misal "Seller Terpercaya"):');
      if (!badge) return;
      await updateDoc(doc(db,"users",btn.dataset.badge), { badges: arrayUnion(badge) });
      showToast("Badge diberikan");
    }));
  }
  document.getElementById("searchUser").addEventListener("input", renderUsers);

  // ===== BANNER & PENGUMUMAN =====
  async function loadBanner(){
    const snap = await getDoc(doc(db,"config","homepage"));
    if (snap.exists()){
      const d = snap.data();
      if (d.bannerImage){
        document.getElementById("bannerPreview").src = d.bannerImage;
        document.getElementById("bannerPreview").style.display = "block";
      }
      document.getElementById("announceText").value = d.announcement || "";
    }
  }
  document.getElementById("btnSimpanBanner").addEventListener("click", async () => {
    const btn = document.getElementById("btnSimpanBanner"); btn.disabled = true;
    try {
      const file = document.getElementById("bannerFile").files[0];
      const announcement = document.getElementById("announceText").value.trim();
      const payload = { announcement, updatedAt: new Date() };
      if (file){
        payload.bannerImage = await compressImage(file, 900, 0.75);
      }
      const existing = await getDoc(doc(db,"config","homepage"));
      await setDoc(doc(db,"config","homepage"), { ...(existing.exists()?existing.data():{}), ...payload });
      showToast("Banner & pengumuman disimpan");
      loadBanner();
    } catch(err){ console.error(err); showToast("Gagal simpan", true); }
    btn.disabled = false;
  });

  // ===== LIVE CHAT =====
  function watchThreads(){
    const q = query(collection(db,"support"), orderBy("lastMessageAt","desc"));
    onSnapshot(q, (snap) => {
      const el = document.getElementById("threadList");
      if (snap.empty){ el.innerHTML = '<div class="empty-state">Belum ada yang chat</div>'; return; }
      el.innerHTML = snap.docs.map(d => {
        const t = d.data();
        return `<div class="card item-card" style="display:flex;cursor:pointer;" data-thread="${d.id}" data-username="${escapeHtml(t.username||'User')}">
          <div class="avatar" style="flex-shrink:0;">${escapeHtml((t.username||"?")[0].toUpperCase())}</div>
          <div class="item-info">
            <p class="item-name">${escapeHtml(t.username||"User")} ${t.unreadByAdmin ? '<span class="nav-dot" style="position:static;display:inline-block;"></span>' : ''}</p>
            <p class="item-sub">${escapeHtml(t.lastMessage||"")}</p>
          </div>
        </div>`;
      }).join("");
      el.querySelectorAll("[data-thread]").forEach(card => card.addEventListener("click", () => openThread(card.dataset.thread, card.dataset.username)));
    });
  }

  let activeThreadUid = null;
  let activeThreadUnsub = null;
  function openThread(uid, username){
    activeThreadUid = uid;
    document.getElementById("chatAdminTitle").textContent = "Chat dengan " + username;
    document.getElementById("modalChatAdmin").style.display = "flex";
    updateDoc(doc(db,"support",uid), { unreadByAdmin:false }).catch(()=>{});
    if (activeThreadUnsub) activeThreadUnsub();
    const q = query(collection(db,"support",uid,"messages"), orderBy("createdAt","asc"));
    activeThreadUnsub = onSnapshot(q, (snap) => {
      const box = document.getElementById("chatAdminBox");
      box.innerHTML = snap.docs.map(d => {
        const m = d.data();
        return `<div class="chat-msg ${m.isAdmin ? 'me' : 'other'}"><span class="chat-name">${escapeHtml(m.isAdmin ? 'Admin' : username)}</span>${escapeHtml(m.text)}</div>`;
      }).join("");
      box.scrollTop = box.scrollHeight;
    });
  }
  document.getElementById("chatAdminClose").addEventListener("click", () => {
    document.getElementById("modalChatAdmin").style.display = "none";
    if (activeThreadUnsub) activeThreadUnsub();
    activeThreadUnsub = null; activeThreadUid = null;
  });
  document.getElementById("chatAdminSend").addEventListener("click", async () => {
    const input = document.getElementById("chatAdminInput");
    const text = input.value.trim();
    if (!text || !activeThreadUid) return;
    input.value = "";
    await addDoc(collection(db,"support",activeThreadUid,"messages"), { senderId: me.uid, isAdmin:true, text, createdAt: new Date() });
    await updateDoc(doc(db,"support",activeThreadUid), { lastMessage: text, lastMessageAt: new Date(), unreadByUser:true, unreadByAdmin:false });
  });
</script>
</body>
</html>
